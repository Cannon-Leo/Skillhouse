name: Gauntlet CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gauntlet:
    name: Run The Gauntlet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Gauntlet (Lint, Typecheck & Coverage)
        run: npm run gauntlet
